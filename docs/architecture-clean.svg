  <text x="523" y="332" text-anchor="middle" font-size="12.5" fill="#7a7a7a">폼 · 검증 · 라우팅</text>
  <text x="523" y="356" text-anchor="middle" font-size="12.5" fill="#7a7a7a">CSS 토큰 · SVG · 폰트</text>

