  <line x1="648" y1="300" x2="686" y2="300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="655" y="290" font-size="11.5" fill="#7a7a7a">compute</text>
  <line x1="686" y1="652" x2="648" y2="652" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="655" y="644" font-size="11.5" fill="#7a7a7a">chart</text>

  <!-- 정적 자산 (top-right, feeds front-end) -->
  <rect x="1350" y="90" width="300" height="180" rx="14" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.6"/>
  <text x="1372" y="126" font-size="17" font-weight="600" fill="#1a1a1a">정적 자산</text>
  <g font-size="13.5" fill="#444">
    <text x="1372" y="154">배경 이미지 (해저)</text>
    <text x="1372" y="180">입력 SVG · 사주 아이콘</text>
    <text x="1372" y="206">폰트: ChosunSg · BMYeonSung</text>
    <text x="1372" y="230">한자: Zen Maru Gothic</text>
  </g>
  <path d="M1350,200 C1300,210 1280,150 1254,180" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- Server -->
  <rect x="1350" y="320" width="300" height="210" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
