  <rect x="686" y="210" width="540" height="560" rx="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="716" y="250" font-size="21" font-weight="600" fill="#1a1a1a">사주 연산 엔진</text>
