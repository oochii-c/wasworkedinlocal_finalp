  <text x="1500" y="426" text-anchor="middle" font-size="13.5" fill="#1a1a1a">POST /api/reading</text>
  <rect x="1372" y="456" width="256" height="46" rx="10" fill="#ffffff" stroke="#9a9a9a"/>
  <text x="1500" y="484" text-anchor="middle" font-size="13.5" fill="#1a1a1a">POST /api/year-fortune</text>

  <!-- pillars.jsonl (RDS-like) -->
  <rect x="1350" y="560" width="300" height="90" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="1372" y="596" font-size="17" font-weight="600" fill="#1a1a1a">📄 pillars.jsonl</text>
  <text x="1372" y="622" font-size="13" fill="#7a7a7a">팔자 append 로그 (DB 없음)</text>
  <line x1="1500" y1="530" x2="1500" y2="560" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>

