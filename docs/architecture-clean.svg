  <text x="1835" y="474" text-anchor="middle" font-size="12.5" fill="#7a7a7a">외부 LLM API</text>
  <path d="M1650,415 L1720,415" fill="none" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ah)"/>
  <path d="M1720,455 L1650,455" fill="none" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="1660" y="405" font-size="11.5" fill="#7a7a7a">chat ▶</text>
  <text x="1662" y="475" font-size="11.5" fill="#7a7a7a">◀ JSON</text>

  <!-- caption -->
  <text x="40" y="860" font-size="13" fill="#9a9a9a">용왕집 (finalp) · System Architecture — 사주 계산 100% 클라이언트, AI 텍스트만 서버 프록시 경유</text>
