  <text x="523" y="470" text-anchor="middle" font-size="20" font-weight="600" fill="#1a1a1a">대시보드</text>
  <text x="523" y="494" text-anchor="middle" font-size="13" fill="#7a7a7a">결과 7블록</text>
  <text x="523" y="522" text-anchor="middle" font-size="12.5" fill="#444">캐릭터 · 원국8자 · 오행</text>
  <text x="523" y="544" text-anchor="middle" font-size="12.5" fill="#444">십성 · 신살 · AI총운 · 대운</text>
  <text x="523" y="576" text-anchor="middle" font-size="12" fill="#7a7a7a">BottomNav</text>

  <!-- front <-> dashboard -->
  <line x1="523" y1="388" x2="523" y2="430" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah0)"/>

