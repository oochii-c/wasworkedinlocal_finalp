    <text x="736" y="522" font-size="12.5" fill="#7a7a7a">연·월·일·시 8자 + 지장간·납음·십이운성</text>

    <rect x="716" y="550" width="480" height="66" rx="12" fill="#ffffff" stroke="#9a9a9a"/>
    <text x="736" y="578" font-weight="600">④ 확장 집계</text>
    <text x="736" y="600" font-size="12.5" fill="#7a7a7a">오행 · 십성 5분류 · 신살 21종 · 대운/세운</text>
  </g>
