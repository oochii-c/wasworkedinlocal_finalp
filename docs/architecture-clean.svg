    <text x="736" y="444" font-size="12.5" fill="#7a7a7a">진태양시 −32분 · DST −60분 · 야자시</text>

    <rect x="716" y="472" width="480" height="66" rx="12" fill="#ffffff" stroke="#9a9a9a"/>
