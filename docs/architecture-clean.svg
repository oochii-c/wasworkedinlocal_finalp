  <rect x="1720" y="360" width="230" height="150" rx="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1835" y="418" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">OpenRouter</text>
