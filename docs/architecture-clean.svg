<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="900" viewBox="0 0 2000 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="ah0" markerWidth="12" markerHeight="12" refX="1" refY="4" orient="auto"><path d="M9,0 L0,4 L9,8 Z" fill="#1a1a1a"/></marker>
  </defs>
  <rect width="2000" height="900" fill="#ffffff"/>

  <!-- USER -->
  <circle cx="105" cy="430" r="72" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="105" y="438" text-anchor="middle" font-size="26" font-weight="600" fill="#1a1a1a">USER</text>
  <!-- USER <-> Front-end -->
  <line x1="178" y1="430" x2="392" y2="430" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah0)"/>

  <!-- BROWSER outer -->
  <rect x="330" y="70" width="960" height="760" rx="22" fill="#ffffff" stroke="#8a8a8a" stroke-width="2"/>
  <text x="366" y="118" font-size="26" font-weight="600" fill="#1a1a1a">🖥  BROWSER</text>
  <text x="366" y="142" font-size="14" fill="#7a7a7a">Vite dev · :5173</text>

